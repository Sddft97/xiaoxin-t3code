name: Stardust Release (macOS + Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Public Stardust version, or leave empty for stardust.version.json
        type: string
        default: ""
      windows_smoke_from_run:
        description: Private CI run ID to reuse a verified Windows installer for smoke fixes
        type: string
        default: ""
      create_draft_release:
        description: Create a draft only after both native builds and parity checks pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Read release version and channel
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_config="$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/stardust.version.json?ref=$GITHUB_SHA")"
          version="${REQUESTED_VERSION:-$(jq -er .version <<< "$release_config")}"
          channel="$(jq -er .channel <<< "$release_config")"
          [[ "$version" =~ ^[1-9][0-9]{0,3}\.[0-9]{1,4}\.[0-9]{1,4}$ ]]
          [[ "$channel" == stable ]]
          printf 'version=%s\nchannel=%s\n' "$version" "$channel" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }} native build and smoke
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            platform: mac
            target: dir
            arch: arm64
            rust_target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      T3CODE_DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
      T3CODE_DESKTOP_PLATFORM: ${{ matrix.platform }}
      T3CODE_DESKTOP_TARGET: ${{ matrix.target }}
      T3CODE_DESKTOP_ARCH: ${{ matrix.arch }}
      T3CODE_DESKTOP_OUTPUT_DIR: release/stardust-${{ matrix.platform }}
      T3CODE_DESKTOP_SIGNED: "false"
      T3CODE_TELEMETRY_ENABLED: "false"
      VITE_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      T3CODE_DESKTOP_WEB_ASSET_BRAND: production
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      # Orphaned reference gitlinks under .repos break checkout credential cleanup.
      - name: Check out the dispatch commit
        env:
          FETCH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git config core.longpaths true
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\r\n')"
          echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          printf '%s\n' '/*' '!/.repos/' | git sparse-checkout set --no-cone --stdin
          git -c checkout.workers=0 checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          corepack_dir="$(mktemp -d -t stardust-corepack.XXXXXX)"
          npm install --prefix "$corepack_dir" --no-save --package-lock=false corepack@0.36.0
          corepack_bin="$corepack_dir/node_modules/.bin"
          export PATH="$corepack_bin:$PATH"
          corepack enable --install-directory "$corepack_bin" pnpm
          if [[ "$RUNNER_OS" == Windows ]]; then
            cygpath -w "$corepack_bin" >> "$GITHUB_PATH"
          else
            printf '%s\n' "$corepack_bin" >> "$GITHUB_PATH"
          fi
          corepack install
          pnpm install --frozen-lockfile

      - name: Verify the source Windows installer run
        if: runner.os == 'Windows' && inputs.windows_smoke_from_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.windows_smoke_from_run }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == zds-xiaoxin/stardust-ci ]]
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          run="repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN"
          source_sha="$(gh api "$run" | jq -r --arg branch "$GITHUB_REF_NAME" '
            select(.path == ".github/workflows/stardust-release.yml" and .event == "workflow_dispatch")
            | select(.head_branch == $branch or (.head_branch | startswith("build/")))
            | .head_sha
          ')"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          gh api "$run/jobs" | jq -e 'any(.jobs[]; .name == "windows-x64 native build and smoke" and any(.steps[]; .name == "Package native desktop application" and .conclusion == "success") and any(.steps[]; .name == "Upload package" and .conclusion == "success"))'
          gh api "repos/$GITHUB_REPOSITORY/compare/$source_sha...$GITHUB_SHA" | jq -e '.status == "ahead" and (.files | length < 300) and all(.files[]; .filename == ".github/workflows/stardust-release.yml" or (.filename | startswith("scripts/stardust-release/")))'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: runner.os == 'Windows' && inputs.windows_smoke_from_run != ''
        with:
          name: stardust-windows-x64
          path: ${{ env.T3CODE_DESKTOP_OUTPUT_DIR }}
          run-id: ${{ inputs.windows_smoke_from_run }}
          github-token: ${{ github.token }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: runner.os != 'Windows' || inputs.windows_smoke_from_run == ''
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Build native resource monitor
        if: runner.os != 'Windows' || inputs.windows_smoke_from_run == ''
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "$RUST_TARGET"

      - name: Select the Xcode 26 SDK for the Apple Speech helper
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          developer_dir=/Applications/Xcode_26.3.app/Contents/Developer
          test -d "$developer_dir"
          DEVELOPER_DIR="$developer_dir" xcrun --sdk macosx --show-sdk-version
          printf 'DEVELOPER_DIR=%s\n' "$developer_dir" >> "$GITHUB_ENV"

      - name: Package native desktop application
        if: runner.os != 'Windows' || inputs.windows_smoke_from_run == ''
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          unset T3CODE_CLERK_PUBLISHABLE_KEY T3CODE_CLERK_JWT_TEMPLATE T3CODE_CLERK_CLI_OAUTH_CLIENT_ID T3CODE_RELAY_URL
          node scripts/build-desktop-artifact.ts

      - name: Finalize macOS ZIP
        if: runner.os == 'macOS'
        run: bash scripts/stardust-release/mac-package.sh

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stardust-${{ matrix.name }}
          path: ${{ env.T3CODE_DESKTOP_OUTPUT_DIR }}/Stardust-v${{ env.VERSION }}-*
          if-no-files-found: error
          retention-days: 14

      - name: Capture Windows installer and Start menu, then silently install
        id: windows_install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Resolve-Path "release/stardust-win/Stardust-v$env:VERSION-Windows-x64-Setup.exe").Path
          New-Item -ItemType Directory parity-evidence -Force | Out-Null
          $shell = './scripts/stardust-release/windows-shell.ps1'
          foreach ($theme in @('light','dark')) {
            & $shell -Action theme -Theme $theme
            try {
              & $shell -Action installer -Setup $setup -Output "parity-evidence/installer-$theme.png"
            } catch {
              Write-Warning "Installer screenshot ($theme): $_"
            }
          }
          & $shell -Action install -Setup $setup -Version $env:VERSION -Output "release/stardust-win/executable.txt"
          foreach ($theme in @('light','dark')) {
            & $shell -Action theme -Theme $theme
            try {
              & $shell -Action start -Output "parity-evidence/start-menu-$theme.png"
            } catch {
              Write-Warning "Start menu screenshot ($theme): $_"
            }
          }

      - name: Verify Windows installer and shortcut metadata
        if: runner.os == 'Windows' && !cancelled() && steps.windows_install.outcome == 'success'
        shell: pwsh
        run: |
          $setup = (Resolve-Path "release/stardust-win/Stardust-v$env:VERSION-Windows-x64-Setup.exe").Path
          ./scripts/stardust-release/windows-shell.ps1 -Action verify -Setup $setup -Version $env:VERSION -Output release/stardust-win/executable.txt

      - name: Run packaged smoke and capture screenshots
        run: |
          set -euo pipefail
          executable_file="$T3CODE_DESKTOP_OUTPUT_DIR/executable.txt"
          if [[ "$RUNNER_OS" == Windows ]]; then
            pwsh -NoProfile -File scripts/stardust-release/windows-shell.ps1 -Action smoke \
              -Version "$VERSION" -ExecutableFile "$executable_file" -Output parity-evidence
          else
            node scripts/stardust-release/smoke.ts \
              --version "$VERSION" --executable-file "$executable_file" \
              --output parity-evidence --native
          fi

      - name: Silently uninstall Windows package
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/stardust-release/windows-shell.ps1 -Action uninstall

      - name: Upload fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.name }}
          path: parity-evidence/
          if-no-files-found: warn
          retention-days: 14

  parity:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch parity script at the dispatch commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p scripts/stardust-release
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/scripts/stardust-release/report.mjs?ref=$GITHUB_SHA" \
            > scripts/stardust-release/report.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidence-*
          path: evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stardust-*
          path: packages-for-checksum
          merge-multiple: true
      - name: Generate comparison and check evidence is complete
        run: |
          npm install --no-save --ignore-scripts --package-lock=false --prefix scripts/stardust-release pngjs@7.0.0
          node scripts/stardust-release/report.mjs evidence/evidence-macos-arm64 evidence/evidence-windows-x64 parity/parity-report.html
      - name: Hash both release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: packages-for-checksum
        run: sha256sum "Stardust-v${VERSION}-macOS-arm64.zip" "Stardust-v${VERSION}-Windows-x64-Setup.exe" > ../parity/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stardust-parity-report
          path: |
            parity/parity-report.html
            parity/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: inputs.create_draft_release
    needs: [prepare, build, parity]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stardust-*
          path: release-assets
          merge-multiple: true

      - name: Verify checksums and create draft
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mac="Stardust-v${VERSION}-macOS-arm64.zip"
          win="Stardust-v${VERSION}-Windows-x64-Setup.exe"
          sha256sum -c SHA256SUMS.txt
          gh release create "v${VERSION}" "$mac" "$win" SHA256SUMS.txt parity-report.html \
            --draft --target "$GITHUB_SHA" --title "Stardust v${VERSION}" \
            --notes "请先检查 Windows 实拍及双平台对照。Review the native Windows screenshots and parity report before publishing."
