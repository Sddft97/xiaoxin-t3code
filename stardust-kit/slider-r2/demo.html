<head>

<title>星尘 · 推理强度滑块 · 第 2 轮 · 银河划星</title>
<link rel="stylesheet" href="gx.css">
<script>
addEventListener('DOMContentLoaded', () => {
  if ("slider-r2" === 'slider-r4-q') document.querySelector('#vSeg [data-l="Q"]').click();
  const component = document.querySelector("#modeRoot .th-dark .gx");
  if (!component) throw new Error('Missing original workshop component: ' + "#modeRoot .th-dark .gx");
  const stage = document.createElement('div');
  stage.id = 'workshop-original';
  document.body.insertBefore(stage, document.body.firstChild);
  let branch = component;
  while (branch.parentElement !== document.body) {
    const parent = branch.parentElement;
    for (const sibling of parent.children) {
      if (sibling === branch) continue;
      if ("slider-r2" === 'v16-stardust-observatory' && sibling.matches('.card')) {
        sibling.inert = true;
        sibling.style.cssText += ';position:fixed;left:0;top:0;width:min(280px,100vw);visibility:hidden;pointer-events:none';
      } else sibling.style.setProperty('display', 'none', 'important');
    }
    branch = parent;
  }
  for (const child of document.body.children) {
    if (child !== stage && child !== branch && !child.matches('svg,script,style')) {
      child.style.setProperty('display', 'none', 'important');
    }
  }
  stage.append(branch);
  for (let el = branch; el !== component; el = [...el.children].find(n => n.contains(component))) {
    el.style.cssText += ';display:block!important;width:100%;min-width:0;max-width:none;margin:0;padding:0;min-height:0;background:transparent;border:0;box-shadow:none';
  }
  document.body.style.cssText += ';width:auto;max-width:none;margin:0;padding:0;background:#111025;min-height:0';
  document.documentElement.style.background = '#111025';
  if (component.matches('.gx,.cos')) {
    const row = () => {
      stage.style.width = '360px';
      stage.style.marginInline = 'auto';
      stage.style.zoom = Math.min(1, document.documentElement.clientWidth / 360);
    };
    row();
    addEventListener('resize', row);
  }
});
</script></head>
<body>

<div class="bar">
  <h1>星尘 · 推理强度滑块 · 第 2 轮<small>银河划星 · 紧凑版 · 设计稿（canvas + CSS，无依赖）</small></h1>
  <div class="grp">档位数<div class="seg" id="nSeg"><button data-n="3" aria-pressed="false">3</button><button data-n="4" aria-pressed="false">4</button><button data-n="5" aria-pressed="true">5</button></div></div>

<style>

<script src="gx-engine.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const G=GXG,LAB=GX_LABELS;
const Q=new URLSearchParams(`mode=pop&c=A&${location.search.slice(1)}`),MODE=Q.get('mode');
if(Q.get('rm')==='1')document.documentElement.classList.add('rm');
if((MODE&&MODE!=='perf')||Q.get('manual')==='1')G.manual=true;

const VARS=[
 {id:'A',name:'细光带 · 彗尾',en:'Thin Band + Comet',
  pitch:'一条贴着轨道的、极细的银河光带（带宽随档位 6→9px，内含稀疏星屑），小星划过时拖出一条会「拉长、变亮、变粗」的发光彗尾。最像你描述的那一幕：一颗亮星在银河里划过。静止时只有一条安静的光带，已走过的一段被淡紫点亮，档位越高越亮；极慢流光 12s 一次。',
  facts:[['银河带','3 层柔和光带 + 1.2px 芯线 + ~66 颗静态星屑'],['冲击','彗尾长度 24→120px、星芒光晕、沿途星尘、速度线、环 + 星芒'],['最克制','改动面最小，最贴近参考；性能最稳']]},
 {id:'B',name:'星尘带 · 星过尘分',en:'Stardust Band that Parts',
  pitch:'银河不是一条线，而是 ~190 粒细星尘组成的带。星星划过时，星尘被点亮并向上下「分开」又回落，被点亮的尘粒自然构成发光的尾迹——尾迹是物质，不是画出来的线。档位越高，分开的幅度越大、点亮范围越宽；到「极限」整条星尘带一起闪烁一下。最「星尘」，也最有质感，成本稍高一点。',
  facts:[['银河带','~190 粒微尘，按档位分「已点亮 / 未点亮」两种色'],['冲击','点亮半径 12→34px、上下分开幅度 ×5、速度线、粒子、环 + 带闪'],['质感','最强：尾迹由尘粒构成']]},
 {id:'C',name:'光带 · 背景视差',en:'Band + Parallax Stars',
  pitch:'在 A 的光带上多加三层背景星：远 / 中 / 近三层以不同速度随星星位移（视差），高速时近层星被拉成短线（曲速感），到站时还会「顿」一下再回稳——整个星野跟着星星「撞」了一下。每升一档，星野位置不同，所以档位也能从背景读出来。最有「在宇宙里飞」的纵深感，但画面最忙。',
  facts:[['银河带','同 A + 3 层背景星（~28 颗），随星星视差平移'],['冲击','同 A + 近层星拉线 + 到站顿挫'],['取舍','纵深感最强，但元素最多，需要克制']]}
];
const STEP_NAMES=(n)=>LAB[n];
const ALL=[];
function mk(host,v,o={}){const s=new GX(host,{variant:v,n:+(window.__N||5),...o});ALL.push(s);return s}

/* ---------- 现状复刻（逐字取自 composerV9.css） ---------- */
function curBox(){const w=document.createElement('div');w.className='cur-box';
  w.innerHTML=`<div class="cur-head"><b><span class="cur-dot"></span><span>推理强度 · 中 Medium</span></b><span class="tagc">V18 Starship Launch Stack</span></div>
  <div class="cur-sub"><span>猛禽点火 · 夹钳弹开</span><span>5 档连续流体演进</span></div>
  <div class="cur-well"><div class="cur-track"><i></i><b></b></div></div>
  <div class="cur-scale"><span>低 Low</span><span class="on">中 Med</span><span>高 High</span><span>超高 XHigh</span><span>Max</span></div>`;return w}
function popReplica(sec){
  const w=document.createElement('div');w.className='pop';
  w.innerHTML=`<div class="mps"><span>⌕</span><span style="color:var(--fg3)">搜索模型</span><span>⌘K</span></div>
    <div class="mtabs"><span>★ 常用</span><span class="on">Claude</span><span>Codex</span><span>本地</span></div>
    <div class="mlist"><div class="mi"><span class="nm">Opus 5.5</span><span class="mt">1M</span></div><div class="mi on"><span class="nm">Sonnet 5.5</span><span class="mt">200K</span><span class="ck">✓</span></div><div class="mi"><span class="nm">Haiku 5.5</span><span class="mt">200K</span></div></div>`;
  w.appendChild(sec);
  const pr=document.createElement('div');pr.className='prow';pr.innerHTML=`<span>权限</span><span class="segc"><span>询问</span><span class="on">自动</span><span>完全访问</span></span>`;w.appendChild(pr);return w}
const th2=(cls,child,extra='')=>{const d=document.createElement('div');d.className=cls+' '+extra;d.appendChild(child);return d};
const box=()=>document.createElement('div');

/* ---------- 高度测量 ---------- */
const H={};
function measureHeights(){
  const t=document.createElement('div');t.className='th-light';t.style.cssText='position:absolute;left:-9999px;top:0;width:362px';
  const cb=curBox(),gb=box();t.appendChild(cb);t.appendChild(gb);document.body.appendChild(t);
  const g=new GX(gb,{variant:'A',n:5,v:2});
  H.before=cb.getBoundingClientRect().height;H.after=gb.getBoundingClientRect().height;
  g.setLabelsMode('all');H.afterAll=gb.getBoundingClientRect().height;
  H.track=g.stage.getBoundingClientRect().height;H.head=gb.querySelector('.gx-h').getBoundingClientRect().height;
  g.ro.disconnect();G.all.delete(g);t.remove();
  return H}

/* ================= 主页面 ================= */
function buildMain(){
  measureHeights();
  const cut=(1-H.after/H.before)*100,cutAll=(1-H.afterAll/H.before)*100;
  $('#hSub').innerHTML=`左：现状（用真实 <code>composerV9.css</code> 的 <code>[data-cosmic-*]</code> 规则复刻，轨道内星舰画面为示意）。右：紧凑版（头一行 + 细轨道 + 两端标签，无卡片框，仅顶部发丝线）。高度用浏览器实测。`;
  const hb=$('#hbox');hb.className='hcmp';
  const mkCol=(title,el,th)=>{const c=document.createElement('div');c.className='hcol';c.innerHTML=`<h4>${title}</h4>`;const w=document.createElement('div');w.className='wellh '+th;const p=document.createElement('div');p.className='pop';p.style.width='100%';p.appendChild(el);w.appendChild(p);c.appendChild(w);return c};
  hb.appendChild(mkCol(`现状 · 实测 ${H.before.toFixed(1)}px`,curBox(),'th-light'));
  const ag=box();hb.appendChild(mkCol(`紧凑版 · 实测 ${H.after.toFixed(1)}px`,ag,'th-light'));mk(ag,'A',{v:3});
  const nums=document.createElement('div');nums.innerHTML=`<div class="hbig">−${cut.toFixed(0)}%</div><p style="margin:6px 0 12px;color:#6e6e73;font-size:12.5px">区域总高度（目标 ≥ 40%）</p>
    <div class="hnums"><span class="r">现状（真实 CSS 复刻）</span><b>${H.before.toFixed(1)} px</b><span></span>
    <span class="r">现状（v1.2.0 录屏 GIF，2× 量得）</span><b>≈ 176 px</b><span></span>
    <span class="r">紧凑版 · 仅两端标签</span><b>${H.after.toFixed(1)} px</b><span class="neg">−${cut.toFixed(0)}%</span>
    <span class="r">紧凑版 · 展开全部标签</span><b>${H.afterAll.toFixed(1)} px</b><span class="neg">−${cutAll.toFixed(0)}%</span>
    <span class="r">　其中 轨道（舞台）</span><b>${H.track.toFixed(0)} px</b><span class="r">现状 56px（50 轨道 + 3+3 内衬）</span>
    <span class="r">　其中 头部一行</span><b>${H.head.toFixed(0)} px</b><span class="r">现状 标题行 + 副标题行 ≈ 41px</span></div>`;
  hb.appendChild(nums);

  /* 总览 */
  const ov=$('#overview');
  ['th-light','th-dark'].forEach(th=>{const col=document.createElement('div');col.className='col '+th;
    VARS.forEach(c=>{const cell=document.createElement('div');cell.className='cell';cell.innerHTML=`<div class="cap"><b>${c.id} · ${c.name}</b><span>${c.en}</span></div>`;const b=box();cell.appendChild(b);col.appendChild(cell);mk(b,c.id,{v:1}).ov=true});
    ov.appendChild(col)});
  /* 卡片 */
  const cards=$('#cards');
  VARS.forEach(c=>{const card=document.createElement('div');card.className='card';
    card.innerHTML=`<h3>${c.id} · ${c.name}<i>${c.en}</i></h3><div class="cardrow"><div><p>${c.pitch}</p><dl class="facts">${c.facts.map(f=>`<dt>${f[0]}</dt><dd>${f[1]}</dd>`).join('')}<dt>渲染成本</dt><dd class="costline" data-c="${c.id}">${costText(COST[c.id])}</dd></dl></div><div class="pair"></div></div>`;
    const pair=$('.pair',card);
    ['th-light','th-dark'].forEach((th,i)=>{const w=document.createElement('div');w.className='well2 '+th;const b=box();w.appendChild(popReplica(b));pair.appendChild(w);mk(b,c.id,{v:i?4:3})});
    cards.appendChild(card)});
  /* 工具条 */
  $('#nSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const n=+b.dataset.n;window.__N=n;[...$('#nSeg').children].forEach(x=>x.setAttribute('aria-pressed',x===b));ALL.forEach(s=>s.setN(n));buildSync(n)});
  const tgl=(id,fn)=>$(id).addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);fn(on)});
  tgl('#rmBtn',on=>document.documentElement.classList.toggle('rm',on));
  tgl('#shimBtn',on=>document.documentElement.classList.toggle('noshim',!on));
  tgl('#slowBtn',on=>{G.scale=on?.25:1});
  tgl('#lblBtn',on=>ALL.forEach(s=>s.setLabelsMode(on?'all':'ends')));
  $('#demoBtn').addEventListener('click',()=>demo());
  buildSync(5);
  function buildSync(n){const sy=$('#syncSeg');sy.innerHTML='';LAB[n].forEach((l,i)=>{const b=document.createElement('button');b.textContent=l;b.setAttribute('aria-pressed','false');
    b.onclick=()=>{ALL.forEach(s=>s.setValue(i,{user:true}));[...sy.children].forEach(x=>x.setAttribute('aria-pressed',x===b))};sy.appendChild(b)})}
  let demoTimer=null;
  function demo(){clearTimeout(demoTimer);const n=window.__N||5,seq=[...Array(n).keys()];const down=[...seq].reverse().slice(1);let i=0;
    ALL.forEach(s=>s.jump(0));
    const run=()=>{const up=i<seq.length;const v=up?seq[i]:down[i-seq.length];if(v===undefined)return;ALL.forEach(s=>s.setValue(v,{user:true}));i++;demoTimer=setTimeout(run,up?800:520)};
    demoTimer=setTimeout(run,250)}
  $('#recbox').innerHTML=recHtml();
}

const FILES={A:'A-band-comet',B:'B-dust-parts',C:'C-parallax'};
function recHtml(){
  const cut=(1-H.after/H.before)*100,cutAll=(1-H.afterAll/H.before)*100;
  const cs=['A','B','C'].map(v=>{const c=COST[v]||{};return `<tr><td>${v}</td><td>${c.idle??'—'}%</td><td>${c.change?c.change.msPerFrame:'—'} ms</td><td>${c.change?c.change.total:'—'} ms / ${c.change?c.change.frames:'—'} 帧</td><td>${c.throttle4x?c.throttle4x.ms+' ms':'—'}</td><td>${c.change?c.change.durationMs+' ms':'—'}</td></tr>`}).join('');
  const gal=['A','B','C'].map(v=>`<div class="card" style="margin-top:14px"><h3>${v} · ${VARS.find(x=>x.id===v).name}<i>产出物</i></h3>
    <video data-review-src="video/${FILES[v]}.mp4" controls loop muted playsinline style="width:100%;border-radius:12px;background:#111"></video>
    <p style="margin:10px 0 4px;font-size:12px;color:#6e6e73">4 秒 MP4（60fps，逐档上升再逐档下降，下方小条是该次冲击强度）　·　<a href="png/${FILES[v]}-contact-sheet.png">联系表（全部档位 · 亮/暗 · 冲击瞬间）</a>　·　<a href="png/${FILES[v]}-in-popover.png">放进弹窗</a>　·　<a href="png/${FILES[v]}-before-after-height.png">前后高度对比</a></p>
    <img data-review-src="png/${FILES[v]}-before-after-height.png" style="width:100%;border-radius:12px" alt=""></div>`).join('');
  return `<h3>推荐与取舍</h3>
   <p><b>首选 A · 细光带 + 彗尾</b>：最贴近「一颗星在银河里划过」的画面，最克制、成本最低，也最容易在真实界面里落地；亮色下仍然是 Apple 中性。想要更有「星尘质感」可选 <b>B</b>（尾迹由尘粒构成，暗色下最漂亮，成本约为 A 的 1.6 倍，仍然很小）。<b>C</b> 纵深感最强但元素最多，建议只做成可选的「曲速」彩蛋风格，不作默认。</p>
   <p><b>高度</b>：现状 ${H.before.toFixed(0)}px → 紧凑版 ${H.after.toFixed(0)}px（<b>−${cut.toFixed(0)}%</b>；展开全部档位标签 ${H.afterAll.toFixed(0)}px，−${cutAll.toFixed(0)}%）。去掉了卡片框、副标题行、徽章、50px 的胶囊轨道和整行标签。</p>
   <p><b>冲击阶梯</b>（目标档位越高越猛）：彗尾 24→120px、光晕、沿途星尘、速度线条数 0→4、到站粒子 2→15、<b>超高/极限</b>出现冲击环，<b>极限</b>再加十字星芒、带内闪烁、一次眨眼。降档统一轻柔：只留短而淡的尾、2 粒微尘、无环无速度线。</p>
   <p><b>成本</b>（Chrome 实测，一次升档）：</p>
   <table style="border-collapse:collapse;font-size:12.5px"><tr style="color:#6e6e73"><th align=left style="padding:2px 16px 2px 0">变体</th><th align=left style="padding:2px 16px 2px 0">空闲主线程</th><th align=left style="padding:2px 16px 2px 0">每帧脚本</th><th align=left style="padding:2px 16px 2px 0">每次升至极限（脚本合计）</th><th align=left style="padding:2px 16px 2px 0">4× 降速 CPU</th><th align=left>动效持续</th></tr>${cs}</table>
   <p style="color:#6e6e73">1 个 canvas（无离屏画布、无 SVG 滤镜）；rAF 只在换档后 ~0.4–0.6s 内运行，收尾即停；静止时只有一个纯 CSS 的极慢流光（12s，transform，合成器线程，可关）。减少动态：静态、0 帧，像素与动画收尾态一致。</p>
   <p><b>星座连线</b>（第 1 轮概念 4）不作默认，已打包为开源积木：<code>kit/v20-constellation/</code>（<a href="kit/v20-constellation/demo.html">demo.html</a> 自包含、中英切换、亮暗、3/4/5 档；PROMPT.zh/en、README、MIT 头），待你审阅后再放入仓库。</p>
