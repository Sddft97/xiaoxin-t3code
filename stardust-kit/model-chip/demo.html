<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星尘 · 模型 chip 紧凑化方案（设计稿）</title>
<style>
/* =====================================================================
   星尘 model chip 紧凑化 · 纯视觉稿（未改动任何 app 仓库）
   色板：light = Apple-neutral（紫仅作小面积强调 #5B4BE0）；dark = 夜紫（强调 #6A5AF0）
   ===================================================================== */
*{box-sizing:border-box}
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB",sans-serif}
.th-light{
  --page:#F5F5F7;--surface:#fff;--fg:#1D1D1F;--fg2:rgba(60,60,67,.74);--fg3:rgba(60,60,67,.46);
  --chip:#F1F1F3;--chip-h:#E7E7EB;--hair:rgba(0,0,0,.09);--line:rgba(0,0,0,.10);
  --tile:#fff;--tile-ring:rgba(0,0,0,.10);--tile-sh:0 .5px 1.5px rgba(0,0,0,.10);--logo:#EDEDF0;
  --acc:#5B4BE0;--acc-thin:#5B4BE0;--acc-bg:rgba(91,75,224,.10);--acc-fg:#5B4BE0;
  --ink:#1D1D1F;--ink-fg:#fff;--oai:#000;--pop:#fff;--pop-sh:0 0 0 .5px rgba(0,0,0,.10),0 10px 28px -6px rgba(0,0,0,.20);
  --comp-sh:0 0 0 .5px rgba(0,0,0,.10),0 8px 24px -8px rgba(0,0,0,.10);--ok:#1d8a3f;--warn:#9A5200;
}
.th-dark{
  --page:#0B0A1F;--surface:#171538;--fg:#F2F0FF;--fg2:rgba(212,204,255,.72);--fg3:rgba(212,204,255,.46);
  --chip:#272454;--chip-h:#322F68;--hair:rgba(212,204,255,.12);--line:rgba(212,204,255,.14);
  --tile:#37336F;--tile-ring:rgba(212,204,255,.16);--tile-sh:0 .5px 1.5px rgba(0,0,0,.35);--logo:#26235A;
  --acc:#6A5AF0;--acc-thin:#8D7DFF;--acc-bg:rgba(141,125,255,.18);--acc-fg:#B3A8FF;
  --ink:#F2F0FF;--ink-fg:#171538;--oai:#fff;--pop:#26235A;--pop-sh:0 0 0 .5px rgba(212,204,255,.16),0 14px 34px -6px rgba(3,2,20,.7);
  --comp-sh:0 0 0 .5px rgba(212,204,255,.14),0 14px 36px -10px rgba(3,2,20,.7);--ok:#30d158;--warn:#FFC65C;
}
html,body{margin:0}
body{font:14px/1.5 var(--font);background:#ECECF0;color:#1D1D1F;-webkit-font-smoothing:antialiased}
.page{width:1360px;margin:0 auto;padding:44px 0 90px}
h1{font-size:30px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:21px;margin:0 0 4px;letter-spacing:-.005em}
h3{font-size:15px;margin:0 0 6px}
p.lead{color:#555a66;margin:0 0 4px;max-width:980px}
.sec{margin-top:54px;padding-top:6px}
.sec>p{color:#5b6070;margin:2px 0 16px;max-width:1040px}
.muted{color:#6b7080}
code,.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
.card{background:#fff;border-radius:16px;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 6px 20px -10px rgba(0,0,0,.12);padding:20px 22px}
.reco{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center}
.reco b.tag{display:inline-block;background:#5B4BE0;color:#fff;border-radius:999px;font-size:11px;padding:2px 9px;margin-right:6px;vertical-align:2px}
ul.tight{margin:6px 0 0;padding-left:18px}ul.tight li{margin:3px 0}

/* ---- stage: 一块 composer 表面，用来放 chip ---- */
.stage{background:var(--surface);color:var(--fg);border-radius:12px;box-shadow:inset 0 0 0 .5px var(--line);padding:16px 18px;display:flex;align-items:center;gap:14px;min-height:62px;position:relative}
.stage.pad{padding:22px 22px}
.stage .lab{font-size:11px;color:var(--fg3)}
.grid-m{display:grid;grid-template-columns:230px 1fr 1fr 150px;gap:10px 12px;align-items:stretch}
.grid-m .hd{font-size:12px;color:#6b7080;padding:0 4px;display:flex;align-items:end}
.vname{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:4px 6px}
.vname b{font-size:14px}.vname span{font-size:12px;color:#6b7080;line-height:1.4}
.vname .star{color:#5B4BE0}
.wcell{display:flex;flex-direction:column;justify-content:center;font-size:12px;color:#444;gap:1px;padding-left:4px}
.wcell b{font-size:15px;font-variant-numeric:tabular-nums}.neg{color:#1d8a3f;font-weight:600}.pos{color:#c0262d;font-weight:600}
.pair{display:flex;gap:18px;align-items:center}
.pair .lab{font-size:11px;color:var(--fg3);width:34px;flex:none}

/* ================== model chip（共用） ================== */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;border-radius:999px;background:var(--chip);color:var(--fg);
  font:560 12px/1 var(--font);white-space:nowrap;position:relative;flex:none;border:0;padding:0;cursor:default;transition:background .16s}
.chip:hover,.chip.hov{--chip:var(--chip-h)}
.chip .nm{display:block;overflow:hidden;text-overflow:ellipsis;max-width:var(--nmw,128px);line-height:15px;letter-spacing:.005em}
svg.pv{width:15px;height:15px;display:block;flex:none;overflow:visible}
.pv.claude{color:#D97757}.pv.codex,.pv.grok,.pv.ollama{color:var(--oai)}
.tile{position:relative;width:22px;height:22px;border-radius:7px;background:var(--tile);flex:none;display:grid;place-items:center;
  box-shadow:inset 0 0 0 .5px var(--tile-ring),var(--tile-sh)}
/* 账号角标：墨色实心 + 与 chip 底同色的环形镂空 → 任何底色上都清晰 */
.bdg{position:absolute;right:-4px;bottom:-3px;min-width:12.5px;height:12.5px;padding:0 2.5px;border-radius:7px;background:var(--ink);color:var(--ink-fg);
  font:700 9.5px/12.5px var(--font);text-align:center;box-shadow:0 0 0 1.5px var(--chip);font-variant-numeric:tabular-nums;letter-spacing:0;pointer-events:none}
/* 推理强度：柱状（沿用 app 现有 EffortGlyph 的几何：2px 宽、3px 步长、整数像素） */
svg.bars{width:14px;height:10px;display:block;flex:none;overflow:visible}
svg.bars rect{fill:var(--fg3);opacity:.38}svg.bars rect.on{fill:var(--acc-thin);opacity:1}

/* --- 现状 chip（忠实复刻：19px 瓷砖 + 13px 图标 + 12px/7px 字角标 + 前缀 + 色点药丸） --- */
.chip.cur{height:30px;padding:0 9px 0 6px}
.cur .ctile{position:relative;width:19px;height:19px;border-radius:6px;background:var(--logo);box-shadow:inset 0 0 0 .5px var(--hair);display:grid;place-items:center;flex:none}
.cur .ctile svg.pv{width:13px;height:13px}
.cur .cbdg{position:absolute;right:-2px;bottom:-2px;height:12px;min-width:12px;padding:0 2px;border-radius:999px;background:var(--surface);color:var(--fg3);border:1px solid var(--logo);
  font:600 7px/10px var(--font);text-align:center;box-shadow:0 .5px 1px rgba(0,0,0,.18)}
.cur .nm{font-size:12px;max-width:none}
.cur .tier{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--hair);font:650 10.5px/1.25 var(--font);color:var(--fg2)}
.cur .tier i{width:6.5px;height:6.5px;border-radius:50%;display:block}

/* --- A 数字角标 + 柱状 --- */
.v-a{padding:0 9px 0 3px}
/* --- B 色环 + 弧 --- */
.v-b{padding:0 10px 0 0;gap:7px}
.rw{position:relative;width:28px;height:28px;flex:none}
.rw svg.ring{position:absolute;inset:0;width:28px;height:28px;overflow:visible}
.rw .tile{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%}
.rw .tile svg.pv{width:13.5px;height:13.5px}
.rw .bdg{opacity:0;transform:scale(.7);transition:.16s;right:-3px;bottom:-3px}
.chip:hover .rw .bdg,.chip.hov .rw .bdg{opacity:1;transform:none}
/* --- C 胶囊分段 + 星 --- */
.v-c{padding:0 9px 0 3px}
.seg{height:22px;border-radius:11px;background:var(--tile);box-shadow:inset 0 0 0 .5px var(--tile-ring),var(--tile-sh);display:flex;align-items:center;padding:0 7px 0 3.5px;flex:none}
.seg i.sep{width:1px;height:10px;background:var(--hair);margin:0 5px 0 5px}
.seg b{font:650 11px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--fg)}
svg.stars{height:6.5px;width:32px;display:block;flex:none;overflow:visible}
svg.stars path{fill:var(--fg3);opacity:.32}svg.stars path.on{fill:var(--acc-thin);opacity:1}
/* --- D 角标 + 零宽度强度轨 --- */
.v-d{padding:0 9px 0 3px}
.v-d .tx{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px}
.rail{display:flex;gap:1.5px;height:2px}
.rail i{width:5px;height:2px;border-radius:1px;background:var(--fg3);opacity:.34}
.rail i.on{background:var(--acc-thin);opacity:1}

/* tooltip */
.tipw{position:relative;display:inline-flex}
.tip{position:absolute;left:0;bottom:calc(100% + 8px);background:var(--pop);color:var(--fg);box-shadow:var(--pop-sh);border-radius:10px;padding:8px 11px;font:500 12px/1.45 var(--font);white-space:nowrap;z-index:5;min-width:170px}
.tip b{font-weight:650}.tip .r2{color:var(--fg2);margin-top:1px;display:flex;align-items:center;gap:6px}
.tip .sub{color:var(--fg3);font-size:11px;margin-top:3px}
.tip:after{content:"";position:absolute;left:18px;bottom:-4px;width:8px;height:8px;background:var(--pop);transform:rotate(45deg);box-shadow:1px 1px 0 var(--line)}
.tip.stat{position:static;display:inline-block}.tip.stat:after{display:none}

/* ================== composer 复刻 ================== */
.comp{background:var(--surface);border-radius:20px;box-shadow:var(--comp-sh);color:var(--fg);width:100%}
.comp .ed{padding:15px 18px 0;min-height:44px;font-size:13.5px;color:var(--fg3);line-height:1.4;white-space:nowrap;overflow:hidden}
.comp .cf{display:flex;align-items:center;gap:6px;padding:0 12px 10px 12px;height:46px}
.comp .sp{flex:1}
.sfb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--fg2);flex:none}
.sfb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.perm{display:inline-flex;align-items:center;gap:4.5px;height:28px;padding:0 10px 0 9px;border-radius:999px;font:580 11.5px/1 var(--font);flex:none;background:var(--acc-bg);color:var(--acc-fg);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--acc-fg) 26%,transparent);white-space:nowrap}
.perm svg{width:13.5px;height:13.5px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.send{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff;flex:none;box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 26%,transparent)}
.send svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cmpcard{display:grid;grid-template-columns:150px 1fr 1fr;gap:12px;align-items:stretch;margin-bottom:14px}
.cmpcard .vname{padding:6px 4px}
.thbox{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--page);box-shadow:inset 0 0 0 .5px var(--line)}
.thbox .tg{font-size:11px;color:var(--fg3);display:flex;justify-content:space-between}
.thbox .tg b{color:var(--fg2);font-weight:600}

/* ================== 长名字 / 状态 ================== */
.grid-n{display:grid;grid-template-columns:200px repeat(5,1fr);gap:8px;align-items:center}
.grid-n .stage{min-height:54px;padding:10px 12px;justify-content:flex-start;overflow:hidden}
.grid-n .hd{font-size:12px;color:#6b7080;padding:0 4px}
.grid-n .rn{font-size:12.5px;padding:2px 4px;line-height:1.35}.grid-n .rn small{display:block;color:#7a7f8e;font-size:11px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.rules .card{padding:16px 18px;font-size:13px}.rules h3{margin-bottom:4px}
.lv5{display:flex;flex-wrap:wrap;gap:10px 14px}
.grid-l{display:grid;grid-template-columns:190px 1fr;gap:8px 12px;align-items:center}

/* ================== 图标集 ================== */
.icgrid{display:grid;grid-template-columns:130px repeat(5,1fr);gap:8px}
.icgrid .hd{font-size:11.5px;color:#6b7080;padding:2px 4px;line-height:1.35}
.icgrid .rn{font-weight:600;font-size:13px;display:flex;align-items:center;padding-left:4px}
.icc{display:flex;align-items:center;justify-content:center;gap:12px;min-height:50px;border-radius:12px;background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 .5px var(--line)}
.bare svg.pv{width:var(--s)}
.tint{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--tt);box-shadow:inset 0 0 0 .5px var(--tile-ring)}
.tile.lg{width:var(--ts);height:var(--ts)}

.pxbox{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.pxbox figure{margin:0}
.pxbox figcaption{font-size:12px;color:#6b7080;margin:6px 0 0}
img.px{image-rendering:pixelated;display:block;border-radius:8px;box-shadow:0 0 0 .5px rgba(0,0,0,.14)}
img.nat{display:block;border-radius:8px;box-shadow:0 0 0 .5px rgba(0,0,0,.14)}

/* ================== 导出视图 ================== */
body[data-view=strip],body[data-view=icons]{background:transparent}
body[data-view=strip] .page,body[data-view=icons] .page{width:auto;padding:0}
.stripwrap{display:inline-block}
.striprow{display:flex;gap:0}
.stripcol{padding:10px 12px;display:flex;flex-direction:column;gap:9px;background:var(--surface);color:var(--fg)}
.stripcol .chip{align-self:flex-start}
.sheet{width:1920px;height:1080px;background:linear-gradient(180deg,#F2F2F6,#E8E8EE);padding:36px 48px 30px;position:relative;overflow:hidden;color:#1D1D1F}
.sheet h1{font-size:34px;margin:0}
.sheet .sub{font-size:16px;color:#5b6070;margin-top:2px}
.sheet .cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:20px}
.sheet .col{border-radius:22px;padding:14px 16px 12px;background:var(--page);box-shadow:inset 0 0 0 .5px var(--line);color:var(--fg)}
.sheet .col .ch{display:flex;justify-content:space-between;font-size:13px;color:var(--fg3);margin:0 4px 6px}
.sheet .row{display:grid;grid-template-columns:128px 1fr;gap:14px;align-items:center;margin-bottom:13px}
.sheet .row .vname{padding:0 2px}.sheet .row .vname b{font-size:15px;color:var(--fg)}.sheet .row .vname span{color:var(--fg3);font-size:11.5px}
.sheet .row .comp .ed{padding-top:14px;min-height:42px;font-size:13.5px}
.sheet .row .comp .cf{height:48px;padding-bottom:10px}
.sheet .foot{display:grid;grid-template-columns:560px 1fr 360px;gap:26px;margin-top:6px;align-items:stretch}
.sheet .others{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:2px}
.sheet .others .stage{flex-wrap:wrap;gap:12px 14px;padding:12px 16px;min-height:0}
.sheet .fcard{border-radius:20px;padding:14px 18px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.sheet .fcard h3{font-size:14px;margin:0 0 8px;color:#444}
.sheet .reco2{background:#5B4BE0;color:#fff;border-radius:20px;padding:16px 20px;display:flex;flex-direction:column;justify-content:center}
.sheet .reco2 b{font-size:20px}.sheet .reco2 span{font-size:13.5px;opacity:.9;line-height:1.5;margin-top:4px}
.sheet .zoom{display:flex;gap:14px;align-items:center}
.zoomwrap{zoom:2.6}
.sheet .iconrow{display:flex;gap:10px}
.sheet .iconrow>div{padding:8px 12px;border-radius:12px;display:flex;gap:10px;align-items:center;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--line)}
</style>
<script>
addEventListener('DOMContentLoaded', () => {
  if ("model-chip" === 'slider-r4-q') document.querySelector('#vSeg [data-l="Q"]').click();
  const component = document.querySelector(".reco .stage.th-dark .v-d");
  if (!component) throw new Error('Missing original workshop component: ' + ".reco .stage.th-dark .v-d");
  const stage = document.createElement('div');
  stage.id = 'workshop-original';
  document.body.insertBefore(stage, document.body.firstChild);
  let branch = component;
  while (branch.parentElement !== document.body) {
    const parent = branch.parentElement;
    for (const sibling of parent.children) {
      if (sibling === branch) continue;
      if ("model-chip" === 'v16-stardust-observatory' && sibling.matches('.card')) {
        sibling.inert = true;
        sibling.style.cssText += ';position:fixed;left:0;top:0;width:min(280px,100vw);visibility:hidden;pointer-events:none';
      } else sibling.style.setProperty('display', 'none', 'important');
    }
    branch = parent;
  }
  for (const child of document.body.children) {
    if (child !== stage && child !== branch && !child.matches('svg,script,style')) {
      child.style.setProperty('display', 'none', 'important');
    }
  }
  stage.append(branch);
  for (let el = branch; el !== component; el = [...el.children].find(n => n.contains(component))) {
    el.style.cssText += ';display:block!important;width:100%;min-width:0;max-width:none;margin:0;padding:0;min-height:0;background:transparent;border:0;box-shadow:none';
  }
  document.body.style.cssText += ';width:auto;max-width:none;margin:0;padding:0;background:#111025;min-height:0';
  document.documentElement.style.background = '#111025';
  if (component.matches('.gx,.cos')) {
    const row = () => {
      stage.style.width = '360px';
      stage.style.marginInline = 'auto';
      stage.style.zoom = Math.min(1, document.documentElement.clientWidth / 360);
    };
    row();
    addEventListener('resize', row);
  }
});
</script></head>

</defs></svg>
<div class="page th-light" id="root"></div>

<script>

/* ---------------------------------------------------------------- chip 构造 */
function bars(lv){ if(!lv) return ''; let r='';
  for(let i=0;i<5;i++){const h=2+i*2; r+=`<rect class="${i<lv?'on':''}" x="${i*3}" y="${10-h}" width="2" height="${h}"/>`;}
  return `<svg class="bars" viewBox="0 0 14 10" aria-hidden="true">${r}</svg>`; }
function stars(lv){ if(!lv) return ''; let r='';
  for(let i=0;i<5;i++) r+=`<path class="${i<lv?'on':''}" d="${star(i*6.4)}" transform="translate(0 .2) scale(.5)" style="transform-box:fill-box"/>`;
  // 手动排布：每颗 6.4 宽
  let p=''; for(let i=0;i<5;i++){ p+=`<g transform="translate(${i*6.5} 0) scale(.54)"><path class="${i<lv?'on':''}" d="M6 0l1.9 3.9 4.2.6-3.1 3 .8 4.2L6 9.6 2.2 11.7 3 7.5-.1 4.5l4.2-.6z"/></g>`; }
  return `<svg class="stars" viewBox="0 0 32.5 6.5" aria-hidden="true">${p}</svg>`; }
function ring(lv,acct){ const r=12.25,C=2*Math.PI*r; const col = acct>=2 ? 'var(--acc-thin)' : 'var(--fg3)';
  const arc = lv? `<circle cx="14" cy="14" r="${r}" fill="none" stroke="${col}" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="${(C*lv/5-1).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 14 14)"/>`:'';
  return `<svg class="ring" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="${r}" fill="none" stroke="var(--hair)" stroke-width="1.75"/>${arc}</svg>`; }
function tipText(o){ const who = o.acct? `${PV[o.pv].n} ${o.acct} 号` : PV[o.pv].n;
  return {who, full: `${who} · ${o.full||o.m}${o.lv?` · 推理强度 ${LV[o.lv-1]}`:''}`}; }

function chip(v,o){ // o:{pv,m,cur,acct,lv,hov,id,w}
  const {full}=tipText(o), cls=`chip ${v==='cur'?'cur':'v-'+v}${o.hov?' hov':''}`;
  const at=`aria-label="${full}" data-chip="${o.id||''}"`;
  if(v==='cur'){
    const b = o.acct? `<i class="cbdg">${initial(o.pv)}${o.acct}</i>`:'';
    const tier = o.lv? `<span class="tier"><i style="background:${LVC[o.lv-1]};box-shadow:0 0 5px ${LVC[o.lv-1]}"></i>${LV[o.lv-1]}</span>`:'';
    return `<span class="${cls}" ${at}><span class="ctile">${PV[o.pv].svg}${b}</span><span class="nm">${o.cur||o.m}</span>${tier}</span>`; }
  const badge = o.acct? `<i class="bdg">${o.acct}</i>`:'';
  const nm = `<span class="nm"${o.nmw?` style="--nmw:${o.nmw}px"`:''}>${o.m}</span>`;
  if(v==='a') return `<span class="${cls}" ${at}><span class="tile">${PV[o.pv].svg}${badge}</span>${nm}${bars(o.lv)}</span>`;
  if(v==='b') return `<span class="${cls}" ${at}><span class="rw">${ring(o.lv,o.acct)}<span class="tile">${PV[o.pv].svg}</span>${o.acct?`<i class="bdg">${o.acct}</i>`:''}</span>${nm}</span>`;
  if(v==='c'){ const head = o.acct? `<span class="seg">${PV[o.pv].svg}<i class="sep"></i><b>${o.acct}</b></span>` : `<span class="tile">${PV[o.pv].svg}</span>`;
    return `<span class="${cls}" ${at}>${head}${nm}${stars(o.lv)}</span>`; }
  if(v==='d'){ let r=''; if(o.lv){ for(let i=0;i<5;i++) r+=`<i class="${i<o.lv?'on':''}"></i>`; }
    return `<span class="${cls}" ${at}><span class="tile">${PV[o.pv].svg}${badge}</span><span class="tx">${nm}${o.lv?`<span class="rail">${r}</span>`:''}</span></span>`; }
}
function tipHTML(v,o,stat){ const t=tipText(o);
  const g = o.lv? `<span style="display:inline-flex;gap:6px;align-items:center">推理强度 <b style="color:var(--fg)">${LV[o.lv-1]}</b> <span class="mono" style="color:var(--fg3)">${o.lv}/5</span> ${bars(o.lv)}</span>` : `<span>该模型无推理强度选项</span>`;
  return `<div class="tip${stat?' stat':''}"><div><b>${t.who}</b> · ${o.full||o.m}</div><div class="r2">${g}</div><div class="sub">点击切换模型与账号</div></div>`; }

  <div style="margin-top:22px">${secReco()}</div>${secMatrix()}${secWidthTable()}${secTips()}${secLong()}${secLegib()}${secComposer()}${secIcons()}${secImpl()}`;

function measure(){
  const w=(html)=>{const m=document.getElementById('measure')||(()=>{const d=document.createElement('div');d.id='measure';d.className='th-light';d.style.cssText='position:absolute;left:-9999px;top:0';document.body.appendChild(d);return d})();
    m.innerHTML=html;const e=m.firstElementChild;const r=e.getBoundingClientRect().width;return Math.round(r*10)/10;};
  const cw={}; for(const v of ORDER) cw[v]=w(chip(v,{...BASE,acct:2}));
  document.querySelectorAll('[data-w]').forEach(el=>{const v=el.dataset.w;const a1=w(chip(v,{...BASE})),a2=cw[v];
    const d=v==='cur'?'':` <span class="neg">${Math.round((a2/cw.cur-1)*100)}%</span>`;
    el.innerHTML=`<span>1 账号 <b>${a1}</b> px</span><span>2 账号 <b>${a2}</b> px${d}</span>`;});
  document.querySelectorAll('[data-wt]').forEach(el=>{const [k,v]=el.dataset.wt.split('-');const m=MODELS.find(x=>x.k===k);
    const a=w(chip(v,{...m,acct:2,full:m.full||m.m})),c=w(chip('cur',{...m,acct:2}));
    el.innerHTML=v==='cur'?`<b>${a}</b>`:`<b>${a}</b> <span class="${a>c?"pos":"neg"}">(${a>c?"+":""}${Math.round((a/c-1)*100)}%)</span>`;});
  document.querySelectorAll('[data-cw]').forEach(el=>{const [v]=el.dataset.cw.split('-');el.textContent=`chip ${cw.cur}px → ${cw[v]}px (${Math.round((cw[v]/cw.cur-1)*100)}%)`;});
  document.querySelectorAll('[data-sw]').forEach(el=>{const [v]=el.dataset.sw.split('-');el.textContent=v==='cur'?`${cw.cur}px`:`${cw[v]}px · ${Math.round((cw[v]/cw.cur-1)*100)}%`;});
  const set=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};
  set('rw-d',`${cw.d}px（${Math.round((cw.d/cw.cur-1)*100)}%）`);set('rw-c',`${cw.cur}px`);set('sw-d',`${cw.cur}px → ${cw.d}px（${Math.round((cw.d/cw.cur-1)*100)}%）`);
  window.__cw=cw; window.__ready=true; }
function zoomImgs(){
  const set=(id,f)=>{const e=document.getElementById(id);if(!e)return;const g=()=>{e.style.width=(e.naturalWidth*f)+'px'};e.complete&&e.naturalWidth?g():e.addEventListener('load',g)};
  set('i1',1);set('i1z',3);set('i2',.5);set('i2z',1);set('ic1',1);set('ic1z',3);set('ic2',.5);
}
(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{measure();zoomImgs();});
